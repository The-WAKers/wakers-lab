name: Update publications from PubMed

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday, 03:17 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch papers from PubMed
        run: python scripts/update_publications.py
      - name: Save the updated list
        run: |
          if git diff --quiet -- content/publications.json; then
            echo "No new papers."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/publications.json
          git commit -m "Update publications from PubMed"
          git push
